# 운영 보안 프로필 — 기본 compose 위에 겹쳐 쓴다.
#
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
#
# 기본 구성은 로컬 학습용(무인증·평문·기본 계정)이다. 이 오버레이는:
#   1. 관리 포트를 전부 127.0.0.1에만 바인딩 (외부 노출 차단)
#   2. 기본 계정·빈 Fernet 키 제거 — 시크릿 미설정이면 기동 자체가 실패한다
#   3. OpenSearch TLS + 인증 활성화 (무인증 요청은 401)
#   4. Kafka UI에 로그인 강제
#   5. 시크릿을 .env 평문이 아니라 Docker secrets(./secrets/*, /run/secrets/*)로 주입
#
# 시크릿 파일(./secrets/, gitignore됨 — 목록·생성법은 secrets/README.md):
#   slack_webhook_url · smtp_password · kakao_rest_api_key · kakao_client_secret
#   kakao_refresh_token · opensearch_password · airflow_fernet_key
#   airflow_admin_password
# 비밀 아닌 설정은 .env.prod (env_file, .env.prod.example 참고).
#
# 알려진 한계(실배포 전 반드시 처리):
#   - OpenSearch는 이미지의 데모 인증서·내장 admin 계정을 쓴다. 실배포에서는
#     정식 인증서와 internal_users 교체가 필수다. (#118)
#   - Kafka는 compose 내부 네트워크의 PLAINTEXT다. 포트를 127.0.0.1로 묶어
#     외부 접근은 차단되지만, 브로커를 외부에 열려면 SASL/TLS가 선행돼야 한다. (#118)
#   - Kafka UI 비밀번호는 여전히 .env.prod 환경변수다. provectuslabs/kafka-ui는
#     _FILE 관례를 지원하지 않는다. 127.0.0.1 전용이라 위험도는 낮다.
#   - Airflow가 읽는 앱 시크릿(공공 API 키·Slack)은 아직 .env 바인드 마운트다.
#     docker inspect에는 안 뜨지만, secret 매니저 이관은 #119/#120에서.
#   - 검증 절차·롤백 기준은 SECURITY.md의 "운영 프로필" 절 참고.

secrets:
  slack_webhook_url:
    file: ./secrets/slack_webhook_url
  smtp_password:
    file: ./secrets/smtp_password
  kakao_rest_api_key:
    file: ./secrets/kakao_rest_api_key
  kakao_client_secret:
    file: ./secrets/kakao_client_secret
  kakao_refresh_token:
    file: ./secrets/kakao_refresh_token
  opensearch_password:
    # #118 전까지 OpenSearch는 데모 admin 계정을 쓴다. healthcheck가 admin:admin로
    # 고정돼 있으므로 이 파일 내용도 반드시 "admin" 이어야 한다("진짜" 비밀번호를
    # 넣으면 healthcheck는 초록인데 consumer만 401난다).
    file: ./secrets/opensearch_password
  airflow_fernet_key:
    file: ./secrets/airflow_fernet_key
  airflow_admin_password:
    file: ./secrets/airflow_admin_password

services:
  kafka:
    ports: !override
      - "127.0.0.1:9092:9092"

  airflow:
    ports: !override
      - "127.0.0.1:8080:8080"
    secrets:
      - airflow_fernet_key
      - airflow_admin_password
    # Fernet 키: _CMD 접미사는 base compose가 AIRFLOW__CORE__FERNET_KEY: '' 를
    # 이미 설정해서 안 통한다(Airflow 2.10은 env에 키가 있으면 — 빈 문자열이어도
    # — _CMD 폴백을 건너뛴다). command 안에서 secret 파일 내용을 export 한다.
    # 파일이 없거나(바인드 에러) 비어 있으면(test -s) 기동을 중단한다 — 빈 키로
    # 조용히 뜨면 Connection/Variable 암호화가 사실상 꺼진다.
    command: >
      bash -c "
      set -e &&
      rm -f /opt/airflow/airflow-webserver*.pid &&
      test -s /run/secrets/airflow_fernet_key &&
      test -s /run/secrets/airflow_admin_password &&
      export AIRFLOW__CORE__FERNET_KEY=\"$$(cat /run/secrets/airflow_fernet_key)\" &&
      ADMIN_PW=\"$$(cat /run/secrets/airflow_admin_password)\" &&
      airflow db migrate &&
      (airflow users create --username airflow --password \"$$ADMIN_PW\" --firstname Airflow --lastname Admin --role Admin --email airflow@example.com ||
       airflow users reset-password --username airflow --password \"$$ADMIN_PW\") &&
      exec airflow standalone
      "

  opensearch:
    ports: !override
      - "127.0.0.1:9200:9200"
    environment:
      # 보안 플러그인 활성화 → 데모 TLS 인증서 + 인증 강제
      DISABLE_SECURITY_PLUGIN: 'false'
    healthcheck:
      test: ["CMD-SHELL", "curl -fku admin:admin 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  consumer:
    # 기본 compose의 env_file(- .env)을 통째로 교체한다 — 오버레이는 항목 제거를
    # 못 하므로, 운영 호스트에 시크릿 담긴 dev .env가 남아도 컨테이너에 주입되지
    # 않게 한다. .env.prod에는 비밀 아닌 설정만 둔다(.env.prod.example 참고).
    env_file: !override
      - ./.env.prod
    secrets:
      - slack_webhook_url
      - smtp_password
      - kakao_rest_api_key
      - kakao_client_secret
      - kakao_refresh_token
      - opensearch_password
    environment:
      OPENSEARCH_USE_SSL: 'true'
      OPENSEARCH_USER: admin
      # 값이 아니라 경로만 담긴다 — docker inspect에 노출돼도 안전
      OPENSEARCH_PASSWORD_FILE: /run/secrets/opensearch_password
      SLACK_WEBHOOK_URL_FILE: /run/secrets/slack_webhook_url
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      KAKAO_REST_API_KEY_FILE: /run/secrets/kakao_rest_api_key
      KAKAO_CLIENT_SECRET_FILE: /run/secrets/kakao_client_secret
      KAKAO_REFRESH_TOKEN_FILE: /run/secrets/kakao_refresh_token

  kafka-ui:
    ports: !override
      # 컨테이너 내부 포트는 8080 (기본 compose와 동일 매핑, 바인딩만 축소)
      - "127.0.0.1:8081:8080"
    environment:
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?운영 프로필에는 KAFKA_UI_PASSWORD가 필요합니다}
      # 운영에서는 UI를 통한 클러스터 설정 변경을 막는다
      DYNAMIC_CONFIG_ENABLED: 'false'
