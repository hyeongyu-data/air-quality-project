# 운영 보안 프로필 — 기본 compose 위에 겹쳐 쓴다.
#
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
#
# 기본 구성은 로컬 학습용(무인증·평문·기본 계정)이다. 이 오버레이는:
#   1. REST/관리 포트(9200·8080)를 127.0.0.1에만 바인딩, 관측 UI는 호스트에 미노출
#   2. 기본 계정·빈 Fernet 키 제거 — 시크릿 미설정이면 기동 자체가 실패한다
#   3. OpenSearch TLS + 인증 + 핀된 CA 체인 검증, Consumer는 최소 권한 계정(weather_writer)
#   4. Kafka UI에 로그인 강제
#   5. 시크릿을 .env 평문이 아니라 Docker secrets(./secrets/*, /run/secrets/*)로 주입
#   6. Consumer 컨테이너 non-root (Dockerfile, uid 10001)
#
# 시크릿 파일(./secrets/, gitignore됨 — 목록·생성법은 secrets/README.md):
#   slack_webhook_url · smtp_password · kakao_rest_api_key · kakao_client_secret
#   kakao_refresh_token · opensearch_password(= weather_writer 비밀번호) ·
#   airflow_fernet_key · airflow_admin_password
# 비밀 아닌 설정은 .env.prod (env_file, .env.prod.example 참고).
# OpenSearch security 설정은 ./config/opensearch-security/ (weather_writer 계정 포함).
#
# 기존 볼륨 주의: opensearch_data 볼륨이 이미 있으면 security 설정 초기화가
#   건너뛰어진다(down -v 필요). consumer_state 가 root 소유로 만들어져 있으면
#   non-root Consumer가 못 쓴다(down -v 또는 chown). SECURITY.md "운영 프로필" 참고.
#
# 알려진 한계(실배포 전 처리 — 재검토 조건 명시):
#   - OpenSearch·Consumer는 이미지의 데모 TLS 인증서를 쓴다. 체인 검증은 켰지만
#     데모 CA의 개인키가 공개돼 있어 진짜 MITM 방어는 자체 서명 CA가 필요하다.
#     관리 포트가 127.0.0.1 전용이라 지금은 낮은 위험 — 브로커/OS를 외부에 열 때
#     자체 CA 생성. SECURITY.md에 절차 설계.
#   - Kafka는 compose 내부 네트워크 PLAINTEXT다. 9092는 127.0.0.1 전용, 9093은
#     호스트 미노출. 브로커를 네트워크 밖에 열면 SASL/SCRAM 선행. (설계는 SECURITY.md)
#   - Kafka UI 비밀번호는 .env.prod 환경변수다(Spring Boot _FILE 미지원). 호스트
#     미노출이라 위험도 낮음.
#   - Airflow가 읽는 앱 시크릿(공공 API 키·Slack)은 아직 .env 바인드 마운트다.
#     docker inspect에는 안 뜨지만, secret 매니저 이관은 #120에서.
#   - Airflow 메타DB는 PostgreSQL(#119). 비밀번호·DSN은 Docker secrets.
#   - 검증 절차·롤백 기준은 SECURITY.md의 "운영 프로필" 절 참고.

secrets:
  slack_webhook_url:
    file: ./secrets/slack_webhook_url
  smtp_password:
    file: ./secrets/smtp_password
  kakao_rest_api_key:
    file: ./secrets/kakao_rest_api_key
  kakao_client_secret:
    file: ./secrets/kakao_client_secret
  kakao_refresh_token:
    file: ./secrets/kakao_refresh_token
  opensearch_password:
    # Consumer가 쓰는 weather_writer 계정 비밀번호(admin 아님, #118). 기본값
    # "weatherwriter" — 교체하면 config/opensearch-security/internal_users.yml 의
    # weather_writer.hash 도 scripts/opensearch_hash.sh 로 재생성해야 한다.
    file: ./secrets/opensearch_password
  airflow_fernet_key:
    file: ./secrets/airflow_fernet_key
  airflow_admin_password:
    file: ./secrets/airflow_admin_password
  postgres_password:
    file: ./secrets/postgres_password
  airflow_db_conn:
    # 전체 SQLAlchemy DSN. postgres_password 와 같은 비밀번호를 담아야 한다
    # (secrets/README.md 의 스니펫으로 한 값에서 둘 다 생성). _CMD 는 shlex.split
    # 되므로 명령 치환 불가 — 파일에 URL 전체를 그대로 둔다.
    file: ./secrets/airflow_db_conn

services:
  kafka:
    ports: !override
      - "127.0.0.1:9092:9092"

  postgres:
    secrets:
      - postgres_password
    environment:
      # base 의 평문 POSTGRES_PASSWORD 를 제거 — 이미지가 평문과 _FILE 동시 설정을 거부한다
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  airflow:
    ports: !override
      - "127.0.0.1:8080:8080"
    secrets:
      - airflow_fernet_key
      - airflow_admin_password
      - airflow_db_conn
    environment:
      # DB conn 은 이미지 엔트리포인트가 컨테이너 command 보다 먼저(airflow db check,
      # create_www_user) 필요로 한다 → command 안 export 로는 늦다. base env 를
      # !reset 하고 _CMD 로 읽는다(_CMD 는 shell 평가가 아니므로 bare `cat` 이어야 함).
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: !reset null
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: "cat /run/secrets/airflow_db_conn"
    # Fernet 키: base 의 AIRFLOW__CORE__FERNET_KEY: '' 가 _CMD 폴백을 막으므로
    # (엔트리포인트는 fernet 을 검증하지 않아 여기서 export 로 충분하다) command 안
    # export. 파일이 없거나(바인드 에러) 비어 있으면(test -s) 기동을 중단한다.
    command: >
      bash -c "
      set -e &&
      rm -f /opt/airflow/airflow-webserver*.pid &&
      test -s /run/secrets/airflow_fernet_key &&
      test -s /run/secrets/airflow_admin_password &&
      export AIRFLOW__CORE__FERNET_KEY=\"$$(cat /run/secrets/airflow_fernet_key)\" &&
      ADMIN_PW=\"$$(cat /run/secrets/airflow_admin_password)\" &&
      airflow db migrate &&
      (airflow users create --username airflow --password \"$$ADMIN_PW\" --firstname Airflow --lastname Admin --role Admin --email airflow@example.com ||
       airflow users reset-password --username airflow --password \"$$ADMIN_PW\") &&
      exec airflow standalone
      "

  opensearch:
    ports: !override
      - "127.0.0.1:9200:9200"
    environment:
      # 보안 플러그인 활성화 → 데모 TLS 인증서 + 인증 강제
      DISABLE_SECURITY_PLUGIN: 'false'
    secrets:
      - opensearch_password
    volumes:
      # 데모 security 설정을 이 저장소 버전으로 교체 — weather_writer 최소 권한
      # 계정(#118)이 추가돼 있다. 최초 부팅 시(.opendistro_security 인덱스가 없을
      # 때) 자동 초기화된다. 기존 opensearch_data 볼륨이 있으면 `down -v` 필요.
      # 파일 10개 전체를 마운트해야 한다(부분 마운트 시 config.yml 없어서 부팅 실패).
      - ./config/opensearch-security:/usr/share/opensearch/config/opensearch-security:ro
    healthcheck:
      # admin(공개 데모 비밀번호)이 아니라 weather_writer 로 확인한다.
      test: ["CMD-SHELL", "curl -fk -u weather_writer:$$(cat /run/secrets/opensearch_password) 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  consumer:
    # 기본 compose의 env_file(- .env)을 통째로 교체한다 — 오버레이는 항목 제거를
    # 못 하므로, 운영 호스트에 시크릿 담긴 dev .env가 남아도 컨테이너에 주입되지
    # 않게 한다. .env.prod에는 비밀 아닌 설정만 둔다(.env.prod.example 참고).
    env_file: !override
      - ./.env.prod
    secrets:
      - slack_webhook_url
      - smtp_password
      - kakao_rest_api_key
      - kakao_client_secret
      - kakao_refresh_token
      - opensearch_password
    volumes:
      # 핀된 데모 root CA — verify_certs로 체인 검증에 쓴다. 공개 인증서라 커밋 가능.
      - ./config/opensearch-root-ca.pem:/etc/ssl/opensearch-root-ca.pem:ro
    environment:
      OPENSEARCH_USE_SSL: 'true'
      # admin이 아니라 최소 권한 계정 — weather-* 데이터·템플릿·ISM만 가능
      OPENSEARCH_USER: weather_writer
      OPENSEARCH_VERIFY_CERTS: 'true'
      OPENSEARCH_CA_CERTS: /etc/ssl/opensearch-root-ca.pem
      # 값이 아니라 경로만 담긴다 — docker inspect에 노출돼도 안전.
      # secrets/opensearch_password는 weather_writer 비밀번호여야 한다
      # (internal_users.yml의 해시와 일치, 기본값 "weatherwriter").
      OPENSEARCH_PASSWORD_FILE: /run/secrets/opensearch_password
      SLACK_WEBHOOK_URL_FILE: /run/secrets/slack_webhook_url
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      KAKAO_REST_API_KEY_FILE: /run/secrets/kakao_rest_api_key
      KAKAO_CLIENT_SECRET_FILE: /run/secrets/kakao_client_secret
      KAKAO_REFRESH_TOKEN_FILE: /run/secrets/kakao_refresh_token

  # 관측 UI는 호스트에 포트를 열지 않는다 (#118). 필요할 때만 임시로:
  #   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml \
  #     run --rm --service-ports -p 127.0.0.1:8081:8080 kafka-ui
  # 또는 SSH 로컬 포워딩. 로그인은 그대로 강제한다(포트를 다시 열더라도).
  kafka-ui:
    ports: !override []
    environment:
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?운영 프로필에는 KAFKA_UI_PASSWORD가 필요합니다}
      # 운영에서는 UI를 통한 클러스터 설정 변경을 막는다
      DYNAMIC_CONFIG_ENABLED: 'false'

  # OpenSearch Dashboards(ops 프로필)도 호스트 포트를 열지 않는다.
  # 주의: 이 오버레이는 OpenSearch를 TLS+인증으로 바꾸지만 base compose의 OSD는
  # http://opensearch:9200 + 보안 플러그인 off 를 가정한다. 따라서 `--profile ops`
  # 와 이 오버레이를 함께 쓰면 OSD가 크래시루프한다. prod에서 OSD가 필요하면
  # OPENSEARCH_HOSTS를 https로, DISABLE_SECURITY_DASHBOARDS_PLUGIN=false,
  # kibanaserver 자격증명 배선이 선행돼야 한다(현재 범위 밖 — SECURITY.md).
  opensearch-dashboards:
    ports: !override []
