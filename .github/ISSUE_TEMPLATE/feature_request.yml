name: 기능 요청
description: 새 기능이나 개선을 제안합니다
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 왜 필요한지 배경과 함께.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방식
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위 / 완료 기준
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / 범위 외
    validations:
      required: false
