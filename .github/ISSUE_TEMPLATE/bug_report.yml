name: 버그 리포트
description: 재현 가능한 결함을 신고합니다
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나요
      description: 관찰된 증상을 씁니다. 로그/에러 메시지가 있으면 붙여주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 1, 2, 3 순서로. 관련 서비스(airflow/consumer/kafka 등)를 명시.
      placeholder: |
        1. docker compose up -d
        2. DAG realtime_weather_alert 실행
        3. ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      description: OS, docker compose 버전, 관련 컨테이너
    validations:
      required: false
  - type: checkboxes
    id: security
    attributes:
      label: 보안 확인
      options:
        - label: 첨부한 로그/스크린샷에 API 키·토큰·비밀번호 등 비밀정보가 없음을 확인했습니다
          required: true
