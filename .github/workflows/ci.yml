name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: compile + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 문법 검사 — 외부 의존성 없이 전 소스 컴파일
      - name: Compile sources
        run: python -m compileall producer consumer dags scripts

      - name: Install test deps
        # 패키지 import 스모크 테스트가 실제 런타임 의존성을 필요로 한다.
        # compileall은 문법만 보므로 __init__.py가 없는 이름을 export 해도
        # 잡지 못한다(실제로 DAG가 깨진 적이 있다).
        run: pip install pytest requests python-dotenv kafka-python opensearch-py

      # 순수 함수 단위 테스트 (consumer/rules.py 등)
      - name: Run tests
        run: pytest -q
