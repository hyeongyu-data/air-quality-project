name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: compile + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks가 커밋 이력을 스캔한다
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # 문법 검사 — 외부 의존성 없이 전 소스 컴파일
      - name: Compile sources
        run: python -m compileall producer consumer dags scripts

      - name: Install test deps
        # 런타임 의존성은 consumer 이미지와 같은 핀 파일에서 설치한다.
        # 인라인 목록이면 핀 파일이 CI에서 한 번도 해석되지 않아, 존재하지
        # 않는 버전이나 충돌이 머지 뒤에야 드러난다.
        run: pip install -r requirements-consumer.txt pytest pytest-cov

      # 단위 테스트 + 커버리지 게이트.
      # 바닥값 50%는 현재 실측(53%) 바로 아래다 — 목표가 아니라 후퇴 방지선.
      # 커버리지를 올리면 바닥도 따라 올린다.
      - name: Run tests
        run: pytest -q --cov=consumer --cov=producer --cov-fail-under=50

      # compose 문법·참조 무결성. env_file 참조 때문에 빈 .env가 필요하다.
      - name: Validate docker compose
        run: |
          touch .env
          docker compose config -q

      # 운영 오버레이의 top-level secrets: 는 base config -q 로는 검증되지 않는다.
      # 더미 fixture 로 구문·참조만 확인한다(실제 시크릿 미노출은 SECURITY.md 수동 절차).
      - name: Validate prod overlay
        run: |
          cp .env.prod.example .env.prod
          mkdir -p secrets
          for f in slack_webhook_url smtp_password kakao_rest_api_key kakao_client_secret \
                   kakao_refresh_token opensearch_password airflow_fernet_key airflow_admin_password; do
            echo dummy > "secrets/$f"
          done
          KAFKA_UI_PASSWORD=dummy docker compose -f docker-compose.yaml -f docker-compose.prod.yaml config -q
          rm -rf .env.prod secrets/slack_webhook_url secrets/smtp_password secrets/kakao_rest_api_key \
                 secrets/kakao_client_secret secrets/kakao_refresh_token secrets/opensearch_password \
                 secrets/airflow_fernet_key secrets/airflow_admin_password

      # 정적 분석 — 오류·버그 클래스(E9, F)만 게이트. 스타일 규칙 확장은
      # 전체 diff를 만들므로 별도 판단으로.
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check --select E9,F producer consumer dags scripts tests

      # 의존성 취약점 — 실제 설치되는 핀 파일 기준
      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements-consumer.txt

      # 비밀정보 — 커밋 이력 전체 스캔. .env는 gitignore지만 실수로 커밋된
      # 키·토큰을 머지 전에 잡는다.
      - name: Scan secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --no-banner

      # Dockerfile 검증
      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
