name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: compile + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # 문법 검사 — 외부 의존성 없이 전 소스 컴파일
      - name: Compile sources
        run: python -m compileall producer consumer dags scripts

      - name: Install test deps
        # 패키지 import 스모크 테스트가 실제 런타임 의존성을 필요로 한다.
        # compileall은 문법만 보므로 __init__.py가 없는 이름을 export 해도
        # 잡지 못한다(실제로 DAG가 깨진 적이 있다).
        run: pip install pytest pytest-cov requests python-dotenv kafka-python opensearch-py

      # 단위 테스트 + 커버리지 게이트.
      # 바닥값 50%는 현재 실측(53%) 바로 아래다 — 목표가 아니라 후퇴 방지선.
      # 커버리지를 올리면 바닥도 따라 올린다.
      - name: Run tests
        run: pytest -q --cov=consumer --cov=producer --cov-fail-under=50

      # compose 문법·참조 무결성. env_file 참조 때문에 빈 .env가 필요하다.
      - name: Validate docker compose
        run: |
          touch .env
          docker compose config -q
