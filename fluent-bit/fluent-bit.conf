[SERVICE]
    Flush              1
    Daemon             Off
    Log_Level          info
    Parsers_File       /fluent-bit/etc/parsers.conf

[INPUT]
    Name               tail
    Tag                sensor.json
    Path               /sensor_logs/*.json.log,/sensor_logs/sensor-json.log
    Parser             sensor_json
    DB                 /fluent-bit/state/flb_sensor_json.db
    Read_from_Head     true
    Refresh_Interval   2
    Mem_Buf_Limit      5MB
    Skip_Long_Lines    On

[INPUT]
    Name               tail
    Tag                sensor.text
    Path               /sensor_logs/*.text.log,/sensor_logs/sensor-text.log
    Key                log
    DB                 /fluent-bit/state/flb_sensor_text.db
    Read_from_Head     true
    Refresh_Interval   2
    Mem_Buf_Limit      5MB
    Skip_Long_Lines    On

[FILTER]
    Name               record_modifier
    Match              sensor.json
    Record             pipeline_stage bronze

[FILTER]
    Name               record_modifier
    Match              sensor.text
    Record             pipeline_stage bronze
    Record             source_type text

[OUTPUT]
    Name               kafka
    Match              sensor.json
    Brokers            kafka:9092
    Topics             sensor-json-logs
    Timestamp_Key      fluentbit_time
    rdkafka.client.id  fluent-bit-json

[OUTPUT]
    Name               tcp
    Match              sensor.text
    Host               logstash
    Port               5000
    Format             json_lines
