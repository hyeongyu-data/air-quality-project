---
# This is the internal user database
# The hash value is a bcrypt hash and can be generated with plugin/tools/hash.sh
#
# 이 프로젝트(#118)가 OpenSearch 2.8.0 이미지의 데모 파일에서 손본 것:
#   - 안 쓰는 데모 계정 제거(anomalyadmin·kibanaro·logstash·readall·snapshotrestore)
#     — 알려진 비밀번호를 가진 계정이 weather-network 안에서 접근 가능한 위험 제거
#   - weather_writer(Consumer 전용 최소 권한) 추가
#   - admin·kibanaserver 는 유지: admin 은 break-glass·healthcheck 아님(weather_writer
#     health check 로 전환), kibanaserver 는 reserved 라 두되 OSD-prod 는 미지원

_meta:
  type: "internalusers"
  config_version: 2

# break-glass 전용. 데모 해시 그대로다 — 회전은 securityadmin.sh 가 필요하며
# 자체 서명 CA 도입(SECURITY.md "남은 한계")과 함께 처리한다.
admin:
  hash: "$2a$12$VcCDgh2NDk07JGN0rjGbM.Ad41qVR/YFJcgHp0UGns5JDymv..TOG"
  reserved: true
  backend_roles:
  - "admin"
  description: "break-glass 전용 (데모 해시)"

# reserved 계정이라 남긴다. OSD 를 prod 오버레이와 함께 쓰려면 https+이 계정
# 자격증명 배선이 필요하다(현재 미지원 — docker-compose.prod.yaml 참고).
kibanaserver:
  hash: "$2a$12$4AcgAt3xwOWadA5s5blL6ev39OXDNhmOesEoo33eZtrq2N0YrU3H."
  reserved: true
  description: "Demo OpenSearch Dashboards user"

# --- 이 프로젝트가 추가한 계정 (#118) --------------------------------------
# Consumer 전용. weather-* 데이터·템플릿·ISM 만 다룰 수 있다(roles.yml:weather_manager).
# 해시는 secrets/opensearch_password 의 값과 일치해야 한다. 기본값은 "weatherwriter"
# 이며 배포 시 scripts/opensearch_hash.sh 로 재생성해 교체한다.
weather_writer:
  hash: "$2y$12$vVbbcfKCuEfjoXC9IQPHhOZj0O.NNrxBQu6oe23fFfxemkxWVKs4W"
  reserved: false
  opendistro_security_roles:
  - "weather_manager"
  description: "Consumer 전용 최소 권한 계정"
